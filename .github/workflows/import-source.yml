name: Import project source
on:
  push:
    paths: [".github/workflows/import-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project files
        run: python -m zipfile -e SpatialBlueprintMR-source.zip .
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings docs README.md .gitignore
          git rm SpatialBlueprintMR-source.zip
          git commit -m "Import Unity project and portfolio source"
          git push
